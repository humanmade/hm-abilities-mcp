name: Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    # Only run when the plugin, its tests or the test environment change.
    paths:
      - '**.php'
      - 'tests/**'
      - '.wp-env.json'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ability tests (WordPress 7.0)
    runs-on: ubuntu-latest

    env:
      # Sites run 7.0. `.wp-env.json` leaves core unpinned, so local runs get the latest release.
      WP_ENV_CORE: https://wordpress.org/wordpress-7.0.zip

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # @wordpress/env needs Node 22.13 or later.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Start wp-env
        run: npm run env:start

      - name: Run tests
        run: npm test
