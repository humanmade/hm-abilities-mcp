name: Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    # Only run when the plugin, its tests or the test environment change.
    paths:
      - '**.php'
      - 'tests/**'
      - '.wp-env.json'
      - '.wp-env.test.json'
      - 'package.json'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sites run 7.0. Both wp-env configs leave core unpinned, so local runs get the latest release.
  WP_ENV_CORE: https://wordpress.org/wordpress-7.0.zip

jobs:
  test:
    name: Ability tests (WordPress 7.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # @wordpress/env needs Node 22.13 or later.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Start wp-env
        run: npm run env:start

      - name: Run tests
        run: npm test

  phpunit:
    name: PHPUnit (WordPress 7.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # PHPUnit and the test library's polyfills run from vendor/ inside the wp-env container.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --no-ansi

      # @wordpress/env needs Node 22.13 or later.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Start the wp-env test site
        run: npm run env:test:start

      - name: Run PHPUnit
        run: npm run test:wp
